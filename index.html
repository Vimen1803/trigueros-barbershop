<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triguero's Barbershop</title>
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <meta name="description" content="Triguero's Barbershop, Zaragoza. Especialistas en fades, arreglos de barba y diseños." />
    <meta name="keywords" content="barbería Zaragoza, cortes de pelo hombre Zaragoza, Triguero's Barbershop, fade, arreglo de barba, peluquería masculina Zaragoza, Booksy" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trigueros-barbershop.vercel.app" />
    <meta property="og:title" content="Triguero's Barbershop" />
    <meta property="og:description" content="Triguero's Barbershop, Zaragoza. Especialistas en fades, arreglos de barba y diseños." />
    <meta property="og:image" content="https://trigueros-barbershop.vercel.app/img/triguero.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://trigueros-barbershop.vercel.app" />
    <meta property="twitter:title" content="Triguero's Barbershop" />
    <meta property="twitter:description" content="Triguero's Barbershop, Zaragoza. Especialistas en fades, arreglos de barba y diseños." />
    <meta property="twitter:image" content="https://trigueros-barbershop.vercel.app/img/triguero.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                300: '#fcd34d',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
              },
              dark: {
                800: '#1f2937',
                900: '#111827',
                950: '#030712',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            },
            keyframes: {
              'slide-up-fade': {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'slide-in-bottom': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'slide-up-fade': 'slide-up-fade 0.4s ease-out forwards',
              'slide-in-bottom': 'slide-in-bottom 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Montserrat', sans-serif; }
      .scroll-smooth { scroll-behavior: smooth; }
    </style>
  </head>
  <body class="bg-dark-950 text-white antialiased selection:bg-gold-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
